# Fallback only: the committed Sage.xcodeproj needs Xcode 16+.
# On older Xcode, run `brew install xcodegen && xcodegen` to regenerate it.
name: Sage
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  Sage:
    type: application
    platform: iOS
    sources: [Sage]
    entitlements:
      path: Sage.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sagegraphite.foodtracker
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Sage-Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Sage
        INFOPLIST_KEY_NSCameraUsageDescription: Sage uses the camera to scan barcodes on food packs.
        INFOPLIST_KEY_NSHealthShareUsageDescription: Sage reads your weight, steps and workouts from Apple Health to chart your progress and adjust your calorie budget.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: Sage saves the calories, protein, carbs and fat you log to Apple Health.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
